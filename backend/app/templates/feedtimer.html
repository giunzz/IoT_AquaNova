<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AquaNova – Feed Timer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="icon" type="image/png"
        href="{{ url_for('static', filename='/img/logo_aquanova.png') }}">
  <link rel="stylesheet"
        href="{{ url_for('static', filename='css/styles.css') }}">

  <style>
    :root {
      --brand:#0ea5e9;
      --muted:#6b7280;
      --bg:#f6f7fb;
      --ok:#16a34a;
      --bad:#dc2626;
    }

    *{ box-sizing:border-box; margin:0; padding:0; }

    html, body{
      width:100%;
      height:100%;
      background:var(--bg);
      font-family:system-ui, Arial, sans-serif;
    }

    body{
      display:flex;
      flex-direction:column;
      min-height:100vh;
    }

    header{
      width:100%;
      padding:14px 18px;
      background:var(--brand);
      color:#fff;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .layout{
      display:grid;
      grid-template-columns:240px 1fr;
      width:100%;
      flex:1;
    }

    aside{
      background:#fff;
      border-right:1px solid #e5e7eb;
      padding:16px;
    }

    aside .menu a{
      display:block;
      padding:10px 12px;
      margin-bottom:8px;
      text-decoration:none;
      color:#111;
      border-radius:10px;
    }

    aside .menu a.active{
      background:#eef7ff;
      color:#0a6db2;
    }

    main{ padding:20px; }

    .cards{
      width:100%;
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));
      gap:16px;
    }

    .card{
      background:#fff;
      border-radius:12px;
      padding:18px;
    }

    .grid2{
      width:100%;
      display:grid;
      grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);
      gap:18px;
      margin-top:16px;
    }

    table{ width:100%; border-collapse:collapse; }

    th, td{
      padding:10px 12px;
      border-bottom:1px solid #edf0f4;
      font-size:14px;
      text-align:left;
    }

    .btn{
      background:#2563eb;
      color:#fff;
      border:none;
      border-radius:10px;
      padding:8px 14px;
      cursor:pointer;
    }

    .btn.ghost{
      background:#f3f4f6;
      color:#111;
    }

    .toolbar{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      align-items:end;
    }

    input, select{
      padding:8px 10px;
      border:1px solid #e5e7eb;
      border-radius:8px;
    }

    .menu-toggle{
      display:none;
      background:none;
      border:none;
      color:#fff;
      font-size:26px;
      cursor:pointer;
    }

    @media (max-width:1000px){
      .layout{ grid-template-columns:1fr; }
      aside{ display:none; }
      .grid2{ grid-template-columns:1fr; }
      .menu-toggle{ display:block; }

      aside.active{
        display:block;
        position:fixed;
        top:56px;
        left:0;
        width:100%;
        background:#fff;
        z-index:2000;
      }
    }

    .footer-full{
      width:100%;
      padding:14px 0;
      text-align:center;
      font-size:14px;
      background:#fff;
      color:#6b7280;
      border-top:1px solid #e5e7eb;
    }
  </style>
</head>

<body>

<header>
  <div style="display:flex; align-items:center; gap:10px;">
    <button id="menuBtn" class="menu-toggle">☰</button>
    <h2>AquaNova</h2>
  </div>
  <div style="display:flex; gap:14px; align-items:center">
    <span>Feed Timer</span>
    <a href="{{ url_for('admin_page') }}"
       style="color:#fff;text-decoration:none">Admin</a>
  </div>
</header>

<div class="layout">
  <aside>
    <nav class="menu">
      <a href="{{ url_for('home') }}">Dashboard</a>
      <a href="{{ url_for('temperature_page') }}">Temperature</a>
      <a href="{{ url_for('turbidity_page') }}">Turbidity</a>
      <a class="active" href="{{ url_for('feed_timer_page') }}">Feed Timer</a>
      <a href="{{ url_for('chatbot.chatbot_page') }}">Chatbot</a>
    </nav>
  </aside>

  <main>

    <!-- CARDS -->
    <div class="cards">
      <div class="card">
        <h4>Feed now</h4>
        <div class="toolbar">
          <input type="number" id="fnAmount" min="1" value="20">
          <button class="btn" id="feedNowBtn">Feed</button>
        </div>
      </div>

      <div class="card">
        <h4>Add schedule</h4>
        <div class="toolbar">
          <input type="date" id="scDate">
          <input type="time" id="scTime">
          <select id="scRepeat">
            <option value="none">Once</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
          </select>
          <input type="number" id="scAmount" min="1" value="20">
          <button class="btn" id="addScheduleBtn">Add</button>
        </div>
      </div>
    </div>

    <!-- TABLE -->
    <div class="grid2">
      <div class="card" style="grid-column:1/-1">
        <h3>Current schedules</h3>
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Date</th>
              <th>Time</th>
              <th>Repeat</th>
              <th>Amount</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="scRows"></tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<footer class="footer-full">
  <h4>Thành viên thực hiện</h4>
  <p>
    Hoàng Ngọc Dung – 23139006 |
    Đoàn Minh Duy Bình – 23139005 |
    Trần Hữu Dương – 23130009
  </p>
</footer>

<script>
const FEED_NOW_API   = '/control/feed-now';
const SCHEDULE_API   = '/control/schedule';
const SCHEDULES_API  = '/control/schedules';

/* =========================
   LOAD SCHEDULES
========================= */
async function refreshSchedules(){
  const tbody = document.getElementById('scRows');
  tbody.innerHTML = '';

  try {
    const r = await fetch(SCHEDULES_API);
    const j = await r.json();

    (j.items || []).forEach((s, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${i + 1}</td>
        <td>${s.date}</td>
        <td>${s.time}</td>
        <td>${s.repeat ?? ''}</td>
        <td>${s.amount ?? ''}</td>
        <td>
          <button class="btn ghost"
                  onclick="deleteSchedule('${s.id}')">
            Delete
          </button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  } catch (e) {
    console.error("Load schedules failed", e);
  }
}

/* =========================
   ADD SCHEDULE
========================= */
async function addSchedule(){
  const body = {
    date: scDate.value,
    time: scTime.value,
    repeat: scRepeat.value,
    amount: Number(scAmount.value)
  };

  try {
    const r = await fetch(SCHEDULE_API, {
      method: 'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify(body)
    });

    const res = await r.json();

    // 409 / duplicate → OK
    if (!r.ok && r.status !== 409) {
      alert(res.error || "Add schedule failed");
      return;
    }

    refreshSchedules();

  } catch (e) {
    alert("Server unreachable");
  }
}

/* =========================
   DELETE SCHEDULE (ĐÚNG ID)
========================= */
async function deleteSchedule(id){
  if (!confirm("Delete this schedule?")) return;

  try {
    const r = await fetch(`/control/schedules/${id}`, {
      method: 'DELETE'
    });

    if (!r.ok) {
      alert("Delete failed");
      return;
    }

    refreshSchedules();

  } catch (e) {
    alert("Server unreachable");
  }
}

/* =========================
   FEED NOW
========================= */
feedNowBtn.onclick = async () => {
  try {
    await fetch(FEED_NOW_API, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ amount: Number(fnAmount.value) })
    });
  } catch (e) {
    alert("Feed command failed");
  }
};

/* =========================
   INIT
========================= */
addScheduleBtn.onclick = addSchedule;
refreshSchedules();
setInterval(refreshSchedules, 10000);
</script>

<script>
menuBtn.onclick = () => {
  document.querySelector('aside').classList.toggle('active');
};
</script>

</body>
</html>
