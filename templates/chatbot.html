<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AquaNova – Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="{{ url_for('static', filename='img/logo_aquanova.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/chatbot.css') }}">
</head>

<body>

<header>
  <h2>AquaNova</h2>
  <div style="opacity:.9; display:flex; gap:14px; align-items:center">
    <span>Assistant</span>
  </div>
</header>

<div class="layout">
  <aside>
    <nav class="menu">
      <a href="{{ url_for('home') }}">Dashboard</a>
      <a href="{{ url_for('temperature_page') }}">Temperature</a>
      <a href="{{ url_for('turbidity_page') }}">Turbidity</a>
      <a href="{{ url_for('feed_timer_page') }}">Feed Timer</a>
      <a class="active" href="{{ url_for('chatbot.chatbot_page') }}">Chatbot</a>
    </nav>
  </aside>

  <main>
    <div class="card chatbot-card">

      <h3>AquaNova Assistant</h3>

      <div id="chatBox" class="chat-box"></div>

      <div class="input-area">
        <input id="chatInput" type="text" placeholder="Nói hoặc nhập lệnh…">

        <button id="sendBtn" class="btn secondary">Send</button>

        <button id="micBtn" class="mic-btn">
          <span id="micIcon">🎤</span>
        </button>
      </div>

      <div id="recordingIndicator" class="record-indicator" style="display:none;">
        ● Đang nghe...
      </div>

    </div>
  </main>
</div>

<footer class="footer-full">
  AquaNova © 2025 – IoT Fish Monitoring System
</footer>

<script src="{{ url_for('static', filename='js/chatbot.js') }}"></script>
</body>
</html>
