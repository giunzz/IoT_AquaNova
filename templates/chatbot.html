<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AquaNova – Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="{{ url_for('static', filename='img/logo_aquanova.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/chatbot.css') }}">

  <style>
    :root { --brand:#0ea5e9; --muted:#6b7280; --bg:#f6f7fb; --ok:#16a34a; --bad:#dc2626; }
    *{box-sizing:border-box}
    body{font-family:system-ui, Arial, sans-serif; margin:0; background:var(--bg); color:#111;}
    header{display:flex;align-items:center;justify-content:space-between; gap:12px; padding:14px 18px; background:var(--brand); color:#fff;}
    header h2{margin:0; display:flex; align-items:center; gap:10px}
    header img{height:22px; width:auto}
    .layout{display:grid; grid-template-columns:220px 1fr; min-height:calc(100vh - 56px);}
    aside{background:#fff; border-right:1px solid #e5e7eb; padding:16px;}
    aside .menu a{display:block; padding:10px 12px; color:#111; text-decoration:none; border-radius:10px;}
    aside .menu a.active{background:#eef7ff; color:#0a6db2;}
    main{padding:20px; max-width:1400px}
    .card{background:#fff; padding:16px; border-radius:14px; box-shadow:0 2px 12px rgba(0,0,0,.05);}
    .row{display:grid; grid-template-columns:1.2fr 1fr; gap:16px}
    @media (max-width:1000px){ .layout{grid-template-columns:1fr} aside{display:none} .row{grid-template-columns:1fr} }
    .toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:end; margin-bottom:12px}
    label{font-size:13px; color:#374151; display:block; margin-bottom:6px}
    input{padding:8px 10px; border:1px solid #e5e7eb; border-radius:8px; background:#fff}
    .btn{background:#2563eb;color:#fff;border:none;border-radius:10px;padding:10px 14px;cursor:pointer}
    .btn.secondary{background:#0ea5e9}
    .btn.ghost{background:#f3f4f6; color:#111}
    .muted{color:var(--muted); font-size:13px}
    table{width:100%; border-collapse:collapse}
    th,td{padding:10px 12px; border-bottom:1px solid #edf0f4; font-size:14px; text-align:left}
    .status{padding:4px 10px; border-radius:999px; font-size:12px; display:inline-block}
    .ok{background:#dcfce7; color:#166534}
    .bad{background:#fee2e2; color:#991b1b}
    .pagination{display:flex; gap:6px; align-items:center; justify-content:flex-end; padding-top:10px}
    .tag{font-size:12px; padding:2px 8px; border-radius:999px; background:#eef2ff; color:#3730a3}
    /* SIDEBAR MOBILE STYLE */
    /* ==========================
        RESPONSIVE MOBILE
    ========================== */
  @media (max-width:1000px){

    /* layout collapse */
    .layout{
      grid-template-columns:1fr;
    }

    aside{
      display:none;
    }

    .grid2{
      grid-template-columns:1fr !important;
    }
    
    main{
      padding:16px;
    }

    /* menu button */
    .menu-toggle{
      display:block;
    }

    aside.active{
      display:block !important;
      position:fixed;
      top:60px;
      left:0;
      width:100%;
      background:white;
      box-shadow:0 4px 10px rgba(0,0,0,0.15);
      z-index:1000;
    }

    aside.active .menu a{
      padding:15px 20px;
      border-bottom:1px solid #eee;
      border-radius:0;
    }
  }

  /* Small screens */
  @media (max-width:600px){
    .cards{ grid-template-columns:1fr; }

    table th, table td{
      font-size:12px;
      padding:8px 6px;
      white-space:nowrap;
    }
  }

  /* MENU BUTTON */
  .menu-toggle {
    display:none;
    background:none;
    border:none;
    color:white;
    font-size:26px;
    cursor:pointer;
    margin-right:10px;
  }
  /* SIDEBAR MOBILE STYLE */
  @media (max-width: 1000px) {

    .menu-toggle {
      display: block;
    }

    aside {
      display: none;  /* Ẩn mặc định */
    }

    aside.active {
      display: block !important;
      position: fixed;
      top: 56px; /* chiều cao header */
      left: 0;
      width: 100%;
      background: white;
      z-index: 2000;
      border-top: 1px solid #e5e7eb;
    }

    aside.active .menu a {
      padding: 18px 22px;
      border-bottom: 1px solid #f1f1f1;
      font-size: 16px;
      color: #111;
      display: block;
    }

    /* Ngăn che nội dung */
    main {
      padding-top: 10px;
    }
  }
  aside.active {
    animation: slideDown .20s ease-out;
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-15px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  aside.active {
  animation: slideDown .20s ease-out;
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-15px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  </style>
</head>

<body>


<header>
  <div style="display:flex; align-items:center; gap:10px;">
    <button id="menuBtn" class="menu-toggle">☰</button>
    <h2>AquaNova</h2>
  </div>

  <div style="opacity:.95; display:flex; gap:14px; align-items:center">
    <span>Assistant</span>
    <a href="{{ url_for('admin_page') }}" style="color:#fff; text-decoration:none">Admin</a>
  </div>
</header>


<div class="layout">
  <aside>
    <nav class="menu">
      <a href="{{ url_for('home') }}">Dashboard</a>
      <a href="{{ url_for('temperature_page') }}">Temperature</a>
      <a href="{{ url_for('turbidity_page') }}">Turbidity</a>
      <a href="{{ url_for('feed_timer_page') }}">Feed Timer</a>
      <a class="active" href="{{ url_for('chatbot.chatbot_page') }}">Chatbot</a>
    </nav>
  </aside>

  <main>
    <div class="card chatbot-card">

      <h3>AquaNova Assistant</h3>

      <div id="chatBox" class="chat-box"></div>

      <div class="input-area">
        <input id="chatInput" type="text" placeholder="Nói hoặc nhập lệnh…">

        <button id="sendBtn" class="btn secondary">Send</button>

        <button id="micBtn" class="mic-btn">
          <span id="micIcon">🎤</span>
        </button>
      </div>

      <div id="recordingIndicator" class="record-indicator" style="display:none;">
        ● Đang nghe...
      </div>

    </div>
  </main>
</div>

<footer class="footer-full">
  AquaNova © 2025 – IoT Fish Monitoring System
</footer>

<script src="{{ url_for('static', filename='js/chatbot.js') }}"></script>
<script>
  const menuBtn = document.getElementById('menuBtn');
  const sidebar = document.querySelector('aside');

  menuBtn.addEventListener('click', () => {
    sidebar.classList.toggle('active');
  });
  </script>

</body>
</html>
